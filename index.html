<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Movie</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }

      #startButton {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        padding: 12px 22px;
        font-size: 16px;
        border-radius: 999px;
        border: none;
        background: black;
        color: white;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      #camera {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      a-scene {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
    </style>
  </head>

  <body>
    <!-- スマホのカメラ映像 -->
    <video id="camera" autoplay playsinline muted></video>

    <button id="startButton">ARを開始</button>

    <!-- AR風に動画を重ねる -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true"
    >
      <a-assets>
        <video
          id="arVideo"
          src="QI.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <!-- 画面中央にmp4を表示 -->
      <a-video
        id="moviePlane"
        src="#arVideo"
        position="0 0 -3"
        width="2.4"
        height="1.35"
      ></a-video>

      <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
      const startButton = document.getElementById("startButton");
      const cameraVideo = document.getElementById("camera");
      const arVideo = document.getElementById("arVideo");

      startButton.addEventListener("click", async () => {
        try {
          // カメラ起動
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment"
            },
            audio: false
          });

          cameraVideo.srcObject = stream;

          // mp4再生
          await arVideo.play();

          startButton.style.display = "none";
        } catch (error) {
          console.error(error);
          alert("カメラまたは動画を開始できませんでした。");
        }
      });
    </script>
  </body>
</html>
