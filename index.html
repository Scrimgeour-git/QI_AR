<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QR Code AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <video id="ar-video" src="CQIH-L.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-marker type="pattern" url="pattern-QR_851488.patt">
        
       <a-box position="0 0.5 0" color="red"></a-box>
        </a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('click', function () {
        var v = document.querySelector('#ar-video');
        v.play();
      });
    </script>
  </body>
</html>
